[project]
name = "tick"
version = "0.1.0"
description = "Tick backend API"
readme = "README.md"
authors = [
    { name = "luming.shi", email = "luming_bfm@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tick = "tick.main:main"
## 日K数据
tick-ingest-ths-daily = "tick.market.ingest_ths:main"
## 除权数据
tick-ingest-ths-corp-actions = "tick.market.ingest_ths_corp_actions:main"
## 标的列表
tick-ingest-fuyao-tickers = "tick.market.ingest_fuyao_tickers:main"
## A股交易日历
tick-ingest-fuyao-calendar = "tick.market.ingest_fuyao_calendar:main"
## 复权因子（由不复权日 K 与除权事件计算）
tick-ingest-adjust-factors = "tick.market.ingest_adjust_factors:main"
## 按交易日增量
tick-ingest-ohlcv-batch = "tick.market.ingest_trade_date_batch:main"
tick-migrate-trade-date-partitions = "tick.market.migrate_trade_date_partitions:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tick"]
