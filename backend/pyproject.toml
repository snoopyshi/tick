[project]
name = "tick"
version = "0.1.0"
description = "Tick backend API"
readme = "README.md"
authors = [
    { name = "luming.shi", email = "luming_bfm@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tick = "tick.main:main"
tick-ingest-ths-daily = "tick.market.ingest_ths:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tick"]
